<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align-Items</title>


    <style>

        #container{ 
            background-color: beige;
            border: 5px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-direction: row;
            height: 1200px;
            flex-wrap: wrap;
            justify-content: start;
            align-items: center;
            align-content: start ;
            
        }

        #normal{
            display: flex;
            align-items: normal;
            height: 300px;
        }

        #stretch{
            display: flex;
            align-items: stretch;
            height: 300px;
        }

        #center{
            display: flex;
            align-items: center;
            height: 300px;
        }

        #flex-start{
            display: flex;
            align-items: flex-start;
            height: 300px;
        }

        #flex-end{
            display: flex;
            align-items: flex-end;
            height: 300px;
        }

        #start{
            display: flex;
            align-items: start;
            height: 300px;
        }

        #end{
            display: flex;
            align-items: end;
            height: 300px;
        }

        #baseline{
            display: flex;
            align-items: baseline;
            height: 300px;
        }

        #initial{
            display: flex;
            align-items: initial;
            height: 300px;
        }

        #inherit{
            display: flex;
            align-items: inherit;
            height: 300px;
        }

        #Full-center{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box1{
            border:2px solid black;
            height: 100px;
            width: 100px;
            background-color: red;

        }

        .box12{
            border:2px solid black;
            height: 100px;
            width: 100px;
            background-color: yellow;

        }

        .s1{
            border:2px solid black;
            /* height: 100px; */
            width: 100px;
            background-color: green;

        }
        





    </style>


</head>
<body>

    <div id="normal">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="stretch">
        <div class="s1"></div>
        <div class="s1"></div>
    </div>


    <div id="center">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

     <div id="Full-center">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="flex-start">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="flex-end">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="start">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="end">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="baseline">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="initial">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>

    <div id="inherit">
        <div class="box1"></div>
        <div class="box1"></div>
    </div>


    <div id="container">
        <div class="box12"></div>
        <div class="box12"></div> 
        <div class="box12"></div> 
        <div class="box12"></div> 
        <div class="box12"></div> 

    </div>

    
</body>
</html>
