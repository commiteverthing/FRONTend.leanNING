<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }
        
        
        #container{
            background-color: bisque;
            height: 100vh;
            width: 100vh;
            border: 2px solid black;
        

        }
        #child{
            border: 2px solid black;
            height: 50px;
            width: 200px;
            background-color: blue;
            border-radius: 10%;margin: 10px;
        }

    </style>
</head>
<body>
    <div id="container">
        <div id="child">

        </div>

    </div>
</body>
</html>
