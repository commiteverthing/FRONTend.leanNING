<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex,column,row-reserved,column-reserved</title>
    <style>
        #flex{
            background-color: beige;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
        }

        #column{
            background-color: beige;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-direction: column;
        }

        #row-reserved{
            background-color: beige;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-direction: row-reverse;
        }

        #column-reserved{
            background-color: beige;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-direction: column-reverse;

        }

        .box{
            height: 200px;
            width: 200px;
            border: 2px solid brown;
            margin: 2px;
            padding: 2px;
        }
        #box1{
            background-color: aqua;
        }

        #box2{
            background-color: blue;
        }
        
        #box3{
            background-color: orange;
        }

        #box4{
            background-color:brown ;
        }

    </style>
</head>
<body>
    <!-- flex-direction:flex; -->

    <div id="flex">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>

    <!-- flex-direction:row; -->

    <div id="column">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
    </div>

    <!-- flex-direction:row-reversed  -->

    <div id="row-reserved">
        <div class="box" id="box1">
            <h1>1</h1>
        </div>
        <div class="box" id="box2">
            <h1>2</h1>

        </div>
        <div class="box" id="box3">
            <h1>3</h1>
        </div>
        <div class="box" id="box4">
            <h1>4</h1>
        </div>
    </div>

    <!-- flex-direction:column-reserved; -->

    <div id="column-reserved">
        <div class="box" id="box1">
            <h1>1</h1>
        </div>
        <div class="box" id="box2">
            <h1>2</h1>

        </div>
        <div class="box" id="box3">
            <h1>3</h1>
        </div>
        <div class="box" id="box4">
            <h1>4</h1>
        </div>
    </div>



    
</body>
</html>
