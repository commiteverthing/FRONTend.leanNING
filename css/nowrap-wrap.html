<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-Wrap , wrap , wrap-reverse ,</title>
    <style>
        #nowrap{
            background-color: beige;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-wrap: nowrap; /*it will not came on next line  */
        }

        #wrap{
            background-color: beige;
            border: 2px solid black;
            margin: 2px;
            padding: 2px;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            
        
        }


        

       

        .box{
            height: 100px;
            width:100px;
            border: 2px solid brown;
            margin: 2px;
            padding: 2px;
        }
        #box1{
            background-color: aqua;
        }

        #box2{
            background-color: blue;
        }
        
        #box3{
            background-color: orange;
        }

       

    </style>
</head>
<body>
    

    <div id="nowrap">
        <div class="box" id="box1">
            <h1>nowrap</h1>
        </div>
        <div class="box" id="box2">
            <h1>nowrap</h1>
        </div>
        <div class="box" id="box3">
            <h1>nowrap</h1>
        </div>
        <div class="box" id="box4">
            <h1>nowrap</h1>
    </div>


    <div id="wrap">
        <div class="box" id="box1">
            <h1>wrap</h1>
        </div>
        <div class="box" id="box2">
            <h1>wrap</h1>
        </div>
        <div class="box" id="box3">
            <h1>wrap</h1>
        </div>
        <div class="box" id="box4">
            <h1>wrap</h1>
        </div>
    </div>


    





    
</body>
</html>
