<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text shadow</title>
    <style>
        #text-shadow p{
           
            text-shadow:10px 10px 2px red,
            -10px -10px 5px blue,
            0px 0px 8px green;  
                
            

            
        }
    </style>
</head>
<body>
    <div id="text-shadow">
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Earum deserunt aspernatur nemo facere incidunt eaque voluptatem ipsam officiis, fuga, rem vitae explicabo soluta quibusdam quia? Rerum fugiat ipsum obcaecati quidem?</p>
    </div>
</body>
</html>
