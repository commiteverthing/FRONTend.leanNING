<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media queries:</title>
    <style>
        *::before
        *::after{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #container{
            border: 2px solid black;
            background-color: bisque;
            display: flex;
            flex-direction: row;
            width: 450px;
            margin: 10px;
            padding: 2px;
          
        }

        #box1{
            border: 2px solid blue;
            width: 47%;
            background-color: aquamarine;
            margin: 3px;
            padding: 2px;
            display: flex;
            flex-direction: column;
            
            
        }

        #box2{
            border: 2px solid brown;
            background-color: yellow;
            width: 47%;
      
            
            
        }

        p{
            border: 2px solid red;
        }
        img{
            width: 170px;
            
        }
        
        @media (max-width:640px){
            #container{
                flex-direction: column;
            }
        }


    </style>

</head>
<body>
    <div id="container">
        <div id="box1">
            <p>text1</p>
            <p>text2</p>
        </div>
        <div id="box2">
            <img src="https://i.pinimg.com/736x/8a/c6/35/8ac635d6da5ab7aae0d65b22b6231f4c.jpg" >
        </div>

    </div>

    
</body>
</html>
